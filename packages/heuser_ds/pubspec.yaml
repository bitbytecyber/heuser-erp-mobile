name: heuser_ds
description: Heuser design system — tokens, theme presets and the H* component library.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.1 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  animations: ^3.0.0
  rive: ^0.14.11
  flutter_svg: ^2.3.0
  skeletonizer: ^3.0.0
  infinite_scroll_pagination: ^5.1.1
  mask_text_input_formatter: ^2.9.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  alchemist: ^0.14.0
  very_good_analysis: ^11.0.0

flutter:
  # Fonts live in the design system so every consumer (app, widgetbook,
  # goldens) renders identical type. TextStyles must set `package: 'heuser_ds'`.
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Variable.ttf
    - family: BarlowSemiCondensed
      fonts:
        - asset: fonts/BarlowSemiCondensed-Regular.ttf
          weight: 400
        - asset: fonts/BarlowSemiCondensed-Medium.ttf
          weight: 500
        - asset: fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
