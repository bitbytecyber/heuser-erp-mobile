# Strict by default. CI runs `flutter analyze --fatal-infos --fatal-warnings`,
# so anything the analyzer reports blocks the build. Suppress per line with a
# justified `// ignore:` rather than loosening the rule set.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Generated code is excluded below; everything else must be clean.
    invalid_annotation_target: ignore # freezed + json_serializable combo
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "**/strings.g.dart"
    - "lib/firebase/**"
    - build/**
    - android/**
    - ios/**
    # Each package is analyzed with its own options (make analyze).
    - packages/**
    - apps/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # pubspec dependencies are grouped by purpose with comments, not sorted.
    sort_pub_dependencies: false
    # Keep the classic `ClassName(...)` constructor form: it is what every agent
    # and reviewer recognises; the shorthand buys nothing here.
    unnecessary_type_name_in_constructor: false
    # Public-API docs are overkill for an app; the DS package keeps them on.
    public_member_api_docs: false
    # Trailing commas are enforced by `dart format` on 3.7+; the lint is redundant.
    require_trailing_commas: false
    # Flutter 3.47 wraps lines at 80 by default; keep the formatter in charge.
    lines_longer_than_80_chars: false
    # Everything else from very_good_analysis applies.
