include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.directories.g.dart"
    - build/**

linter:
  rules:
    # pubspec dependencies are grouped by purpose with comments, not sorted.
    sort_pub_dependencies: false
    # Keep the classic `ClassName(...)` constructor form: it is what every agent
    # and reviewer recognises; the shorthand buys nothing here.
    unnecessary_type_name_in_constructor: false
    public_member_api_docs: false
    require_trailing_commas: false
    lines_longer_than_80_chars: false
