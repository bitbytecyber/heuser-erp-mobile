# Native launch screen (`dart run flutter_native_splash:create`).
#
# The native screen is navy with the white lockup; the in-app reveal
# (`HSplashReveal` in heuser_ds, wired in lib/app/app.dart) starts on the same
# navy and lockup, so the hand-off is invisible. Android 12+ ignores `image` and shows only `android_12.image`
# inside a circle, which is why that one is the mark alone.
flutter_native_splash:
  color: "#000F1D"
  color_dark: "#000F1D"
  image: assets/brand/splash-logo.png
  image_dark: assets/brand/splash-logo.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_12:
    color: "#000F1D"
    color_dark: "#000F1D"
    image: assets/brand/splash-android12.png
    image_dark: assets/brand/splash-android12.png
    icon_background_color: "#000F1D"
    icon_background_color_dark: "#000F1D"
  android: true
  ios: true
  web: false
