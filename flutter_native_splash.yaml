# Native launch screen (`dart run flutter_native_splash:create`).
#
# Every platform shows the white mark, 80 x 132 dp, centred on navy: `image`
# is 320 x 530 px at 4x, and Android 12+'s `android_12.image` (1152 px = 288 dp)
# holds the same mark at the same size. The in-app reveal (`HSplashReveal` in
# heuser_ds, wired in lib/app/app.dart) starts from that exact frame, so the
# hand-off is invisible.
flutter_native_splash:
  color: "#000F1D"
  color_dark: "#000F1D"
  image: assets/brand/splash-mark.png
  image_dark: assets/brand/splash-mark.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_12:
    color: "#000F1D"
    color_dark: "#000F1D"
    image: assets/brand/splash-android12.png
    image_dark: assets/brand/splash-android12.png
    icon_background_color: "#000F1D"
    icon_background_color_dark: "#000F1D"
  android: true
  ios: true
  web: false
